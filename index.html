<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ankit AI ✨</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial}
html,body{height:100dvh;background:#020617;color:#fff;overflow:hidden}
body{display:flex;flex-direction:column}
header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#020617;z-index:3}
header b{font-size:19px} header span{font-size:12px;color:#93c5fd}
.topBtns{flex-shrink:0;display:flex;gap:8px;padding:8px 10px;overflow-x:auto;white-space:nowrap;background:#020617;z-index:3}
.topBtns button{border:1px solid #3b82f6;background:#1e3a8a;color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;flex-shrink:0}
.globeWrap{flex-shrink:0;text-align:center;background:#020617;padding:2px 0}
.globe{width:60px;height:60px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 30% 30%,#60a5fa,#1e40af 55%,#020617);display:flex;align-items:center;justify-content:center;font-size:30px}
#chat{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:12px 14px;border-radius:18px;font-size:16px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
.user{align-self:flex-end;background:#7c5cff;border-bottom-right-radius:5px}
.ai{align-self:flex-start;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-bottom-left-radius:5px}
.ai img{max-width:100%;border-radius:12px;margin-top:8px}
.btnRow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.miniBtn{background:#2563eb;color:#fff;border:none;padding:9px 14px;border-radius:20px;font-size:14px}
.miniBtn.green{background:#16a34a}.miniBtn.purple{background:#7c3aed}.miniBtn.orange{background:#ea580c}
.codeBox{background:#0f172a;color:#a5f3fc;padding:12px;border-radius:12px;font-family:monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;margin-top:8px;border:1px solid #22d3ee;max-height:220px;overflow-y:auto;display:none}
.codeBox.show{display:block}
.searchWrap{flex-shrink:0;display:flex;gap:8px;padding:10px;background:#020617;border-top:1px solid rgba(255,255,255,.15)}
.searchWrap button{width:44px;height:46px;border-radius:50%;border:none;font-size:20px;background:#1e293b;color:#fff;flex-shrink:0}
#input{flex:1;border:none;outline:none;background:#1e293b;color:#fff;padding:0 16px;border-radius:25px;font-size:16px;min-width:0}
#send{background:#7c5cff}
.cell{width:55px;height:55px;font-size:26px;background:#1e293b;color:#fff;border:2px solid #7c5cff;border-radius:10px}
.ludoCell{width:42px;height:42px;border:1px solid #fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;background:#1e293b}
</style>
</head>
<body>
<header><div><b>Ankit AI ✨</b><br><span>Apna Desi AI Dost</span></div><div>🌎</div></header>
<div class="topBtns">
<button id="voiceBtn" onclick="toggleVoice()">🔊 Voice: ON</button>
<button onclick="setMode('chat')">💬 Chat</button>
<button onclick="setMode('image')">🎨 Image</button>
<button onclick="setMode('code')">💻 Code</button>
<button onclick="getWeather()">🌦️ Weather</button>
<button onclick="showSongs()">🎵 Gaana</button>
<button onclick="startQuiz()">📝 Quiz</button>
<button onclick="tellJoke()">😂 Joke</button>
<button onclick="showCodeMenu()">🎮 Game</button>
<button onclick="changeTheme()">🎨 Theme</button>
<button onclick="clearChat()">🗑️ Clear</button>
</div>
<div class="globeWrap"><div class="globe">🌎</div></div>
<div id="chat"><div class="msg ai">Namaste! 🙏 Main Ankit AI hu!

Ab Code bhi likhunga! 💻
Bolo:
- "Ludo khelo" = Game khelega
- "Ludo ka code likho" = Pura CODE aayega
- "Calculator ka code likho" = Calculator ka CODE</div></div>
<div class="searchWrap">
<button id="micBtn" onclick="startVoice()">🎤</button>
<input id="input" placeholder="Yahan likho... code likho / ludo khelo..." onkeydown="if(event.key==='Enter')sendMsg()">
<button onclick="document.getElementById('file').click()">+</button>
<button id="send" onclick="sendMsg()">➤</button>
</div>
<input type="file" id="file" hidden accept="image/*" onchange="sendImage(event)">
<script>
var mode='chat', voiceOn=true, lastImageText="";
var chatBox=document.getElementById('chat');
var jokes=["Teacher: Tum late kyu aaye? Student: Sir, board pe likha tha School Ahead, Go Slow isliye slow aaya! 😂","Pappu: Doctor, mujhe bhoolne ki bimari hai. Doctor: Kab se? Pappu: Kab se kya? 😂","Santa: Mera beta bahut hoshiyar hai, usne exam me mere hi naam likh diya! 😂"];
var shayaris=["Teri yaad me humne chai bhi pee li, ab neend nahi aati! ☕","Zindagi me dost nahi, dost me zindagi hai! ❤️","Chandni raat me taare ginna mushkil hai, tum jaise dost ko bhoolna mushkil hai! 🌙"];
var quizQs=[{q:"India ki Rajdhani kya hai?",a:"delhi",opt:"A) Delhi  B) Mumbai  C) Kolkata"},{q:"2 + 2 x 2 = ?",a:"6",opt:"A) 4  B) 6  C) 8"},{q:"Taj Mahal kahan hai?",a:"agra",opt:"A) Delhi  B) Agra  C) Jaipur"}];
var quizIndex=0, quizScore=0, inQuiz=false, oxBoard=["","","","","","","","",""], oxCur="X", oxOver=false, ludoPos=0;
function addMsg(who,text){var d=document.createElement('div');d.className='msg '+who;d.innerText=text;chatBox.appendChild(d);chatBox.scrollTop=chatBox.scrollHeight;return d;}
function speak(t){if(!voiceOn)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t.replace(/[*#]/g,''));u.lang='hi-IN';speechSynthesis.speak(u);}catch(e){}}
function toggleVoice(){voiceOn=!voiceOn;if(!voiceOn)speechSynthesis.cancel();document.getElementById('voiceBtn').innerText=voiceOn?'🔊 Voice: ON':'🔇 Voice: OFF';addMsg('ai',voiceOn?'Voice ON ho gaya! 🔊':'Voice OFF ho gaya! 🔇');}
function setMode(m){mode=m;if(m==='code'){addMsg('ai','💻 Code Mode ON! Ab bolo - "Ludo ka code likho" ya "Calculator ka code likho"');}else if(m==='image'){addMsg('ai','🎨 Image Mode ON! Ab kya image banau?');}else{addMsg('ai','💬 Chat Mode ON!');}}
function changeTheme(){var c=['#020617','#3b0764','#022c22','#450a0a','#1e1b4b'];document.body.style.background=c[Math.floor(Math.random()*c.length)];addMsg('ai','Theme badal diya! 🎨');}
function tellJoke(){var j=jokes[Math.floor(Math.random()*jokes.length)];addMsg('ai',j);speak(j);}
function tellShayari(){var s=shayaris[Math.floor(Math.random()*shayaris.length)];addMsg('ai',s);speak(s);}
function showSongs(){var d=document.createElement('div');d.className='msg ai';d.innerHTML='Konsa gaana sunna hai? 👇';['Arijit Singh - Tum Hi Ho','Shreya Ghoshal - Teri Meri','Bhojpuri Hit Song','Neha Kakkar - Party Song'].forEach(function(s){var b=document.createElement('button');b.className='miniBtn orange';b.style.margin='4px';b.innerText='▶️ '+s;b.onclick=function(){window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(s),'_blank');};d.appendChild(b);d.appendChild(document.createElement('br'));});chatBox.appendChild(d);chatBox.scrollTop=chatBox.scrollHeight;}
function showCodeMenu(){var d=document.createElement('div');d.className='msg ai';d.innerHTML='Konsa Game khelna hai? Dabao! 👇';var arr=[['❌⭕ Ox Game Khelo',playOx],['🎲 Ludo Khelo',playLudo],['🎲 Dice Khelo',playDice],['🧮 Calculator Khelo',playCalc]];arr.forEach(function(a){var b=document.createElement('button');b.className='miniBtn';b.style.margin='4px';b.innerText=a[0];b.onclick=a[1];d.appendChild(b);d.appendChild(document.createElement('br'));});var d2=document.createElement('div');d2.style.marginTop='10px';d2.innerText='Code chahiye to ye dabao 👇';d.appendChild(d2);[['💻 Ludo ka Code', 'Ludo game ka code likho'],['💻 Ox ka Code','Ox game ka code likho'],['💻 Calculator ka Code','Calculator ka code likho']].forEach(function(a){var b=document.createElement('button');b.className='miniBtn purple';b.style.margin='4px';b.innerText=a[0];b.onclick=function(){document.getElementById('input').value=a[1];sendMsg();};d.appendChild(b);d.appendChild(document.createElement('br'));});chatBox.appendChild(d);chatBox.scrollTop=chatBox.scrollHeight;}
function playOx(){oxBoard=["","","","","","","","",""];oxCur="X";oxOver=false;var d=document.createElement('div');d.className='msg ai';d.innerHTML='Ox Game ❌⭕ - X ki baari!';var boardDiv=document.createElement('div');boardDiv.style.display='grid';boardDiv.style.gridTemplateColumns='repeat(3,55px)';boardDiv.style.gap='6px';boardDiv.style.marginTop='10px';function draw(){boardDiv.innerHTML='';oxBoard.forEach(function(v,i){var btn=document.createElement('button');btn.className='cell';btn.innerText=v;btn.onclick=function(){if(oxBoard[i]||oxOver)return;oxBoard[i]=oxCur;var win=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];var w=null;for(var k=0;k<win.length;k++){var c=win[k];if(oxBoard[c[0]]&&oxBoard[c[0]]==oxBoard[c[1]]&&oxBoard[c[1]]==oxBoard[c[2]])w=oxCur;}if(w){addMsg('ai',w+' Jeet Gaya! 🎉');oxOver=true;}else if(oxBoard.indexOf('')===-1){addMsg('ai','Draw ho gaya!');oxOver=true;}else{oxCur=oxCur==='X'?'O':'X';}draw();};boardDiv.appendChild(btn);});}draw();d.appendChild(boardDiv);chatBox.appendChild(d);chatBox.scrollTop=chatBox.scrollHeight;}
function playLudo(){ludoPos=0;var d=document.createElement('div');d.className='msg ai';d.innerHTML='🎲 Ludo Game! Goti 0 pe hai. Dice dabao!';var board=document.createElement('div');board.style.display='grid';board.style.gridTemplateColumns='repeat(5,42px)';board.style.gap='4px';board.style.marginTop='10px';function drawLudo(){board.innerHTML='';for(var i=0;i<20;i++){var c=document.createElement('div');c.className='ludoCell';if(i===ludoPos)c.innerText='🔴';else if(i===19)c.innerText='🏆';else c.innerText=i+1;if(i===ludoPos)c.style.background='#dc2626';board.appendChild(c);}}drawLudo();var btn=document.createElement('button');btn.className='miniBtn green';btn.style.marginTop='10px';btn.innerText='🎲 Dice Phenko!';btn.onclick=function(){var n=Math.floor(Math.random()*6)+1;ludoPos+=n;if(ludoPos>=19){ludoPos=19;drawLudo();addMsg('ai','🎉 Jeet Gaye! Ludo Khatam! Dice: '+n);}else{drawLudo();addMsg('ai','Dice aaya: '+n+' - Goti '+ludoPos+' pe hai!');}};d.appendChild(board);d.appendChild(btn);chatBox.appendChild(d);chatBox.scrollTop=chatBox.scrollHeight;}
function playDice(){var n=Math.floor(Math.random()*6)+1;var faces=['⚀','⚁','⚂','⚃','⚄','⚅'];addMsg('ai','🎲 Dice Phenka! Aaya: '+faces[n-1]+' - '+n);}
function playCalc(){var q=prompt('Hisab likho - jaise 25+45');if(!q)return;try{addMsg('ai','🧮 '+q+' = '+eval(q));}catch(e){addMsg('ai','Galat hisab hai!');}}
function startQuiz(){inQuiz=true;quizIndex=0;quizScore=0;addMsg('ai','📝 Quiz Shuru! 3 sawal hai.');askQuiz();}
function askQuiz(){if(quizIndex>=quizQs.length){addMsg('ai','Quiz Khatam! 🎉 Score: '+quizScore+' / '+quizQs.length);inQuiz=false;return;}addMsg('ai','Q'+(quizIndex+1)+': '+quizQs[quizIndex].q+'\n'+quizQs[quizIndex].opt);}
function getWeather(){var div=addMsg('ai','Mausam dekh raha hu... 🌦️');fetch('https://api.open-meteo.com/v1/forecast?latitude=24.0&longitude=83.5&current=temperature_2m,relative_humidity_2m,wind_speed_10m&timezone=auto').then(function(r){return r.json();}).then(function(data){var c=data.current;div.innerText='📍 Nagar Untari\n🌡️ Temp: '+c.temperature_2m+'°C\n💧 Humidity: '+c.relative_humidity_2m+'%\n💨 Hawa: '+c.wind_speed_10m+' km/h';speak('Nagar Untari me '+c.temperature_2m+' degree hai');}).catch(function(){div.innerText='Net ON karo!';});}
function clearChat(){chatBox.innerHTML='';addMsg('ai','Chat clear ho gaya! ✨');}
function startVoice(){var Rec=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Rec){addMsg('ai','Mic ke liye Chrome me kholo, ya likh ke bhejo! 🎤');return;}document.getElementById('micBtn').innerText='🔴';addMsg('ai','Sun raha hu... Bolo! 🎤');var rec=new Rec();rec.lang='hi-IN';rec.onresult=function(e){document.getElementById('micBtn').innerText='🎤';document.getElementById('input').value=e.results[0][0].transcript;sendMsg();};rec.onerror=function(){document.getElementById('micBtn').innerText='🎤';};rec.onend=function(){document.getElementById('micBtn').innerText='🎤';};try{rec.start();}catch(e){}}
function sendImage(e){var f=e.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){addMsg('user','[Photo bheji]');var d2=document.createElement('div');d2.className='msg ai';d2.innerHTML='Photo mil gayi! 👀 Padh raha hu...';var im=document.createElement('img');im.src=rd.result;d2.appendChild(im);chatBox.appendChild(d2);chatBox.scrollTop=chatBox.scrollHeight;if(typeof Tesseract!=='undefined'){Tesseract.recognize(rd.result,'eng+hin').then(function(res){lastImageText=res.data.text;if(lastImageText.trim().length>5){addMsg('ai','Ho gaya! ✅ Photo padh li! Ab bolo - "Isme kya hai?" ya "Homework karwa do"');}else{addMsg('ai','Photo me text saaf nahi hai.');}}).catch(function(){addMsg('ai','Photo mil gayi! Ab batao kya karna hai?');});}};rd.readAsDataURL(f);e.target.value='';}
function showCodeResult(codeText, title){
var d=document.createElement('div');d.className='msg ai';d.innerHTML='Ho gaya! 🎉 '+title+' ka CODE ban gaya!';
var pre=document.createElement('div');pre.className='codeBox';pre.innerText=codeText;d.appendChild(pre);
var row=document.createElement('div');row.className='btnRow';
var play=document.createElement('button');play.className='miniBtn green';play.innerText='▶️ Chalao / Khelo';play.onclick=function(){var blob=new Blob([codeText],{type:'text/html'});var url=URL.createObjectURL(blob);window.open(url,'_blank');};
var view=document.createElement('button');view.className='miniBtn orange';view.innerText='👀 Code Dekho';view.onclick=function(){pre.classList.toggle('show');view.innerText=pre.classList.contains('show')?'🙈 Code Chhupao':'👀 Code Dekho';};
var copy=document.createElement('button');copy.className='miniBtn purple';copy.innerText='📋 Copy';copy.onclick=function(){navigator.clipboard.writeText(codeText).then(function(){copy.innerText='✅ Copy Ho Gaya!';setTimeout(function(){copy.innerText='📋 Copy';},2000);});};
row.appendChild(play);row.appendChild(view);row.appendChild(copy);d.appendChild(row);chatBox.appendChild(d);chatBox.scrollTop=chatBox.scrollHeight;
}
function handleCodeRequest(q){
var div=addMsg('ai','💻 Code likh raha hu... 10 second ruko...');
var prompt='Create COMPLETE single HTML file. User wants: '+q+'. Must be ONE full HTML file, mobile friendly, beautiful, all buttons must work. Return ONLY code, no explanation. Start with DOCTYPE html';
fetch('https://text.pollinations.ai/'+encodeURIComponent(prompt)+'?model=openai-fast').then(function(r){return r.text();}).then(function(ans){div.remove();var clean=ans.replace(/```html/gi,'').replace(/```/g,'').trim();if(clean.indexOf('<html')===-1 && clean.indexOf('<!DOCTYPE')===-1){clean='<!DOCTYPE html><html><body style="padding:20px;text-align:center;font-family:Arial"><h2>App Ban Gaya!</h2><pre>'+clean+'</pre></body></html>';}showCodeResult(clean,q);speak('Code bana diya');}).catch(function(){div.innerText='Net slow hai, phir se bolo!';});
}
function sendMsg(){var inp=document.getElementById('input');var q=inp.value.trim();if(!q)return;addMsg('user',q);inp.value='';var t=q.toLowerCase();
if(inQuiz){if(t.indexOf(quizQs[quizIndex].a)!==-1)quizScore++;quizIndex++;askQuiz();return;}
if(t.indexOf('code')!==-1 || t.indexOf('html')!==-1 || mode==='code'){handleCodeRequest(q);return;}
if(t.indexOf('joke')!==-1){tellJoke();return;}
if(t.indexOf('shayari')!==-1){tellShayari();return;}
if(t.indexOf('gaana')!==-1||t.indexOf('gana')!==-1||t.indexOf('song')!==-1){showSongs();return;}
if(t.indexOf('quiz')!==-1){startQuiz();return;}
if(t.indexOf('ludo')!==-1){playLudo();return;}
if(t.indexOf('ox')!==-1||t.indexOf('tic')!==-1){playOx();return;}
if(t.indexOf('dice')!==-1){playDice();return;}
if(t.indexOf('calculator')!==-1||t.indexOf('hisab')!==-1){playCalc();return;}
if(t.indexOf('app')!==-1||t.indexOf('banao')!==-1||t.indexOf('game')!==-1||t.indexOf('khelo')!==-1){showCodeMenu();return;}
if(t.indexOf('mausam')!==-1||t.indexOf('weather')!==-1){getWeather();return;}
if(t==='hi'||t==='hello'||t==='hey'||t.indexOf('namaste')!==-1){addMsg('ai','Namaste! 🙏 Kaise ho?');speak('Namaste kaise ho');return;}
if(t.indexOf('kaise ho')!==-1){addMsg('ai','Main ekdum mast hu! 😎 Tum batao?');return;}
if(t.indexOf('bye')!==-1){addMsg('ai','Bye Bye! 👋');return;}
if(t.indexOf('table')!==-1||t.indexOf('pahada')!==-1){var n=parseInt(t.replace(/\D/g,''))||2;var s='📝 '+n+' ka Table:\n';for(var i=1;i<=10;i++)s+=n+' x '+i+' = '+(n*i)+'\n';addMsg('ai',s);return;}
if(t.indexOf('homework')!==-1||t.indexOf('isme kya')!==-1||t.indexOf('is me kya')!==-1){if(lastImageText){var divH=addMsg('ai','Homework dekh raha hu... 📚');fetch('https://text.pollinations.ai/'+encodeURIComponent('Hinglish simple me homework jawab: '+lastImageText.substring(0,2000))).then(function(r){return r.text();}).then(function(a){divH.innerText='📚 Jawab:\n\n'+a;});}else{addMsg('ai','Homework ke liye pehle + dabake Photo bhejo! 📚');}return;}
if(mode==='image'){var div=addMsg('ai','Image bana raha hu... 🎨');var url='https://image.pollinations.ai/prompt/'+encodeURIComponent(q+', cartoon style')+'?seed='+Date.now()+'&width=512&height=512&nologo=true';var img=new Image();img.onload=function(){div.remove();var d=document.createElement('div');d.className='msg ai';d.innerHTML='Ye lo tumhari image! 🎨';var im=document.createElement('img');im.src=url;d.appendChild(im);chatBox.appendChild(d);chatBox.scrollTop=chatBox.scrollHeight;};img.onerror=function(){div.innerText='Net slow hai, phir se bolo!';};img.src=url;return;}
var div2=addMsg('ai','Soch raha hu... 🤔');
fetch('https://text.pollinations.ai/'+encodeURIComponent('Hinglish me short me samjhao, dost jaise: '+q)+'?model=openai-fast').then(function(r){return r.text();}).then(function(ans){div2.innerText=ans;speak(ans);}).catch(function(){div2.innerText='Net slow hai, phir se bhej do! 🙏';});
}
</script>
</body>
</html>
