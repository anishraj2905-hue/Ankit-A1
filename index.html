<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ankit AI ✨</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial}
html,body{height:100dvh;background:#020617;color:#fff;overflow:hidden}
body{display:flex;flex-direction:column}
header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(2,6,23,.9)}
header b{font-size:19px} header span{font-size:12px;color:#93c5fd}
.topBtns{flex-shrink:0;display:flex;gap:8px;padding:8px 10px;overflow-x:auto;white-space:nowrap}
.topBtns button{border:1px solid #3b82f6;background:rgba(30,58,138,.6);color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;flex-shrink:0}
.globeWrap{flex-shrink:0;text-align:center}
.globe{width:85px;height:85px;margin:4px auto;border-radius:50%;background:radial-gradient(circle at 30% 30%,#60a5fa,#1e40af 55%,#020617);box-shadow:0 0 30px #3b82f6;display:flex;align-items:center;justify-content:center;font-size:40px}
#chat{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:12px 14px;border-radius:18px;font-size:16px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
.user{align-self:flex-end;background:#7c5cff;border-bottom-right-radius:5px}
.ai{align-self:flex-start;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-bottom-left-radius:5px}
.ai img{max-width:100%;border-radius:12px;margin-top:8px}
.btnRow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.miniBtn{background:#2563eb;color:#fff;border:none;padding:9px 14px;border-radius:20px;font-size:14px}
.miniBtn.green{background:#16a34a}.miniBtn.purple{background:#7c3aed}.miniBtn.orange{background:#ea580c}.miniBtn.pink{background:#db2777}
.searchWrap{flex-shrink:0;display:flex;gap:8px;padding:10px;background:rgba(2,6,23,.95);border-top:1px solid rgba(255,255,255,.15)}
.searchWrap button{width:44px;height:46px;border-radius:50%;border:none;font-size:20px;background:#1e293b;color:#fff;flex-shrink:0}
#input{flex:1;border:none;outline:none;background:#1e293b;color:#fff;padding:0 16px;border-radius:25px;font-size:16px;min-width:0}
#send{background:#7c5cff}
.cell{width:60px;height:60px;font-size:28px;background:#1e293b;color:#fff;border:2px solid #7c5cff;border-radius:10px}
</style>
</head>
<body>
<header><div><b>Ankit AI ✨</b><br><span>Apna Desi AI Dost</span></div><div>🌎</div></header>
<div class="topBtns">
<button onclick="alert('Voice ON hai!')">🔊 Voice</button>
<button onclick="setMode('chat')">💬 Chat</button>
<button onclick="setMode('image')">🎨 Image</button>
<button onclick="getWeather()">🌦️ Weather</button>
<button onclick="showSongs()">🎵 Gaana</button>
<button onclick="startQuiz()">📝 Quiz</button>
<button onclick="tellJoke()">😂 Joke</button>
<button onclick="showCodeMenu()">💻 App Banao</button>
<button onclick="changeTheme()">🎨 Theme</button>
<button onclick="clearChat()">🗑️ Clear</button>
</div>
<div class="globeWrap"><div class="globe">🌎</div></div>
<div id="chat"><div class="msg ai">Namaste! 🙏 Main Ankit AI hu! Ab sab button pakka chalega - Test wale jaisa! Bolo "Ox game" ya "Joke sunao"!</div></div>
<div class="searchWrap">
<button onclick="alert('Mic ke liye likh ke bhejo!')">🎤</button>
<input id="input" placeholder="Yahan likho..." onkeydown="if(event.key==='Enter')sendMsg()">
<button onclick="alert('Photo ke liye pehle Image banao!')">+</button>
<button id="send" onclick="sendMsg()">➤</button>
</div>
<script>
var mode='chat';
var chatBox=document.getElementById('chat');
var jokes=["Teacher: Tum late kyu aaye? Student: Sir, board pe likha tha School Ahead, Go Slow isliye slow aaya! 😂","Pappu: Doctor, mujhe bhoolne ki bimari hai. Doctor: Kab se? Pappu: Kab se kya? 😂","Santa: Mera beta bahut hoshiyar hai, usne exam me mere hi naam likh diya! 😂"];
var shayaris=["Teri yaad me humne chai bhi pee li, ab neend nahi aati! ☕","Zindagi me dost nahi, dost me zindagi hai! ❤️","Chandni raat me taare ginna mushkil hai, tum jaise dost ko bhoolna mushkil hai! 🌙"];
var quizQs=[{q:"India ki Rajdhani kya hai?",a:"delhi",opt:"A) Delhi  B) Mumbai  C) Kolkata"},{q:"2 + 2 x 2 = ?",a:"6",opt:"A) 4  B) 6  C) 8"},{q:"Taj Mahal kahan hai?",a:"agra",opt:"A) Delhi  B) Agra  C) Jaipur"}];
var quizIndex=0, quizScore=0, inQuiz=false, oxBoard=["","","","","","","","",""], oxCur="X", oxOver=false;
function addMsg(who,text){var d=document.createElement('div');d.className='msg '+who;d.innerText=text;chatBox.appendChild(d);chatBox.scrollTop=chatBox.scrollHeight;return d;}
function setMode(m){mode=m;addMsg('ai',m==='image'?'Image Mode ON hai 🎨 Ab kya image banau? - jaise "Billi ki photo"':'Chat Mode ON hai 💬 Ab pucho!');}
function changeTheme(){var c=['#020617','#3b0764','#022c22','#450a0a','#1e1b4b'];var r=Math.floor(Math.random()*c.length);document.body.style.background=c[r];addMsg('ai','Theme badal diya! 🎨');}
function tellJoke(){addMsg('ai',jokes[Math.floor(Math.random()*jokes.length)]);}
function tellShayari(){addMsg('ai',shayaris[Math.floor(Math.random()*shayaris.length)]);}
function showSongs(){var d=document.createElement('div');d.className='msg ai';d.innerHTML='Konsa gaana sunna hai? 👇';var songs=['Arijit Singh - Tum Hi Ho','Shreya Ghoshal - Teri Meri','Bhojpuri Hit Song','Neha Kakkar - Party Song'];songs.forEach(function(s){var b=document.createElement('button');b.className='miniBtn orange';b.style.margin='4px';b.innerText='▶️ '+s;b.onclick=function(){window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(s),'_blank');};d.appendChild(b);d.appendChild(document.createElement('br'));});chatBox.appendChild(d);chatBox.scrollTop=chatBox.scrollHeight;}
function showCodeMenu(){var d=document.createElement('div');d.className='msg ai';d.innerHTML='Konsa App khelna hai? Dabao! 👇';var arr=[['❌⭕ Ox Game',playOx],['🎲 Dice Game',playDice],['🧮 Calculator',playCalc],['⏰ Stopwatch',playStopwatch]];arr.forEach(function(a){var b=document.createElement('button');b.className='miniBtn';b.style.margin='4px';b.innerText=a[0];b.onclick=a[1];d.appendChild(b);d.appendChild(document.createElement('br'));});chatBox.appendChild(d);chatBox.scrollTop=chatBox.scrollHeight;}
function playOx(){oxBoard=["","","","","","","","",""];oxCur="X";oxOver=false;var d=document.createElement('div');d.className='msg ai';d.innerHTML='Ox Game ❌⭕ - X ki baari!';var boardDiv=document.createElement('div');boardDiv.style.display='grid';boardDiv.style.gridTemplateColumns='repeat(3,60px)';boardDiv.style.gap='6px';boardDiv.style.marginTop='10px';function draw(){boardDiv.innerHTML='';oxBoard.forEach(function(v,i){var btn=document.createElement('button');btn.className='cell';btn.innerText=v;btn.onclick=function(){if(oxBoard[i]||oxOver)return;oxBoard[i]=oxCur;var win=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];var w=null;for(var k=0;k<win.length;k++){var c=win[k];if(oxBoard[c[0]]&&oxBoard[c[0]]==oxBoard[c[1]]&&oxBoard[c[1]]==oxBoard[c[2]])w=oxCur;}if(w){addMsg('ai',w+' Jeet Gaya! 🎉');oxOver=true;}else if(oxBoard.indexOf('')===-1){addMsg('ai','Draw ho gaya!');oxOver=true;}else{oxCur=oxCur==='X'?'O':'X';}draw();};boardDiv.appendChild(btn);});}draw();d.appendChild(boardDiv);chatBox.appendChild(d);chatBox.scrollTop=chatBox.scrollHeight;}
function playDice(){var n=Math.floor(Math.random()*6)+1;var faces=['⚀','⚁','⚂','⚃','⚄','⚅'];addMsg('ai','🎲 Dice Phenka! Aaya: '+faces[n-1]+' - '+n);}
function playCalc(){var q=prompt('Hisab likho - jaise 25+45');if(!q)return;try{var r=eval(q);addMsg('ai','🧮 '+q+' = '+r);}catch(e){addMsg('ai','Galat hisab hai!');}}
function playStopwatch(){addMsg('ai','⏰ Stopwatch - Abhi 10 second ka timer laga diya! 10 second baad bata dunga!');setTimeout(function(){addMsg('ai','⏰ 10 second ho gaya!');},10000);}
function startQuiz(){inQuiz=true;quizIndex=0;quizScore=0;addMsg('ai','📝 Quiz Shuru! 3 sawal hai.');askQuiz();}
function askQuiz(){if(quizIndex>=quizQs.length){addMsg('ai','Quiz Khatam! 🎉 Score: '+quizScore+' / '+quizQs.length);inQuiz=false;return;}var q=quizQs[quizIndex];addMsg('ai','Q'+(quizIndex+1)+': '+q.q+'\n'+q.opt);}
function getWeather(){var div=addMsg('ai','Mausam dekh raha hu... 🌦️');fetch('https://api.open-meteo.com/v1/forecast?latitude=24.0&longitude=83.5&current=temperature_2m,relative_humidity_2m,wind_speed_10m&timezone=auto').then(function(r){return r.json();}).then(function(data){var c=data.current;div.innerText='📍 Nagar Untari\n🌡️ Temp: '+c.temperature_2m+'°C\n💧 Humidity: '+c.relative_humidity_2m+'%\n💨 Hawa: '+c.wind_speed_10m+' km/h';}).catch(function(){div.innerText='Net ON karo!';});}
function clearChat(){chatBox.innerHTML='';addMsg('ai','Chat clear ho gaya! ✨');}
function sendMsg(){var inp=document.getElementById('input');var q=inp.value.trim();if(!q)return;addMsg('user',q);inp.value='';var t=q.toLowerCase();
if(inQuiz){if(t.indexOf(quizQs[quizIndex].a)!==-1)quizScore++;quizIndex++;askQuiz();return;}
if(t.indexOf('joke')!==-1){tellJoke();return;}
if(t.indexOf('shayari')!==-1){tellShayari();return;}
if(t.indexOf('gaana')!==-1||t.indexOf('gana')!==-1||t.indexOf('song')!==-1){showSongs();return;}
if(t.indexOf('quiz')!==-1){startQuiz();return;}
if(t.indexOf('ox')!==-1||t.indexOf('tic')!==-1){playOx();return;}
if(t.indexOf('dice')!==-1){playDice();return;}
if(t.indexOf('calculator')!==-1||t.indexOf('hisab')!==-1){playCalc();return;}
if(t.indexOf('app')!==-1||t.indexOf('banao')!==-1||t.indexOf('game')!==-1){showCodeMenu();return;}
if(t.indexOf('mausam')!==-1||t.indexOf('weather')!==-1){getWeather();return;}
if(t==='hi'||t==='hello'||t==='hey'||t.indexOf('namaste')!==-1){addMsg('ai','Namaste! 🙏 Kaise ho?');return;}
if(t.indexOf('kaise ho')!==-1){addMsg('ai','Main ekdum mast hu! 😎 Tum batao?');return;}
if(t.indexOf('bye')!==-1){addMsg('ai','Bye Bye! 👋');return;}
if(t.indexOf('table')!==-1||t.indexOf('pahada')!==-1){var n=parseInt(t.replace(/\D/g,''))||2;var s='📝 '+n+' ka Table:\n';for(var i=1;i<=10;i++)s+=n+' x '+i+' = '+(n*i)+'\n';addMsg('ai',s);return;}
if(mode==='image'){var div=addMsg('ai','Image bana raha hu... 🎨');var url='https://image.pollinations.ai/prompt/'+encodeURIComponent(q+', cartoon style')+'?seed='+Date.now()+'&width=512&height=512&nologo=true';var img=new Image();img.onload=function(){div.remove();var d=document.createElement('div');d.className='msg ai';d.innerHTML='Ye lo tumhari image! 🎨';var im=document.createElement('img');im.src=url;d.appendChild(im);chatBox.appendChild(d);chatBox.scrollTop=chatBox.scrollHeight;};img.onerror=function(){div.innerText='Net slow hai, phir se bolo!';};img.src=url;return;}
var div2=addMsg('ai','Soch raha hu... 🤔');
fetch('https://text.pollinations.ai/'+encodeURIComponent('Hinglish me short me samjhao, dost jaise: '+q)+'?model=openai-fast').then(function(r){return r.text();}).then(function(ans){div2.innerText=ans;}).catch(function(){div2.innerText='Net slow hai, phir se bhej do! 🙏';});
}
</script>
</body>
</html>
