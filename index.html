<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test</title>
<style>body{background:#020617;color:#fff;font-family:Arial;padding:20px;text-align:center}button{padding:15px 25px;font-size:18px;background:#7c5cff;color:#fff;border:none;border-radius:10px;margin:10px}input{padding:12px;width:80%;border-radius:10px;border:none;font-size:16px}#box{background:#1e293b;padding:15px;border-radius:10px;margin-top:15px;min-height:100px}</style>
</head>
<body>
<h2>Ankit AI - Click Test</h2>
<div id="box">Yahan jawab aayega...</div>
<br>
<input id="input" placeholder="Kuch likho...">
<br><br>
<button onclick="testClick()">☰ Menu Dabao</button>
<button onclick="sendTest()">➤ Send Dabao</button>
<button onclick="alert('Plus dab gaya!')">+ Plus Dabao</button>
<script>
function testClick(){ document.getElementById('box').innerText = 'MENU CLICK HO GAYA! ✅ Ab bada code daal sakte hai.'; alert('Menu Click Ho Gaya!'); }
function sendTest(){ var t=document.getElementById('input').value; document.getElementById('box').innerText = 'Tumne likha: ' + t + ' - SEND CLICK HO GAYA! ✅'; }
</script>
</body>
</html>
